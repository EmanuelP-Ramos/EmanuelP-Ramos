name: Atualizar perfil

on:
  schedule:
    - cron: "0 */6 * * *" # a cada 6 horas
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cartão de stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=EmanuelP-Ramos&show_icons=true&count_private=true&hide_border=true&theme=tokyonight&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Cartão de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=EmanuelP-Ramos&layout=compact&hide_border=true&theme=tokyonight&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Gerar troféu
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: EmanuelP-Ramos
          file: trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Comitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg trophy.svg
          git commit -m "Atualizar cartões e troféu" || exit 0
          git push
